[project]
name = "dbt-core-interface"
version = "1.1.8+liteart.1"
dynamic = []
description = "Dbt Core Interface"
authors = [
  { name = "Alex Butler", email = "butler.alex2010@gmail.com" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10,<3.15"
classifiers = [
  "Development Status :: 4 - Beta",
]
keywords = [
  "dbt",
  "sqlfluff"
]
dependencies = [
  "dbt-core>=1.8.0,<2.0.0",
  "dbt-adapters>=1.3.2",
  "rich>10.0",
  "typing-extensions; python_version < '3.10'",
  "requests>=2.31.0",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/z3z1ma/dbt-core-interface"
Repository = "https://github.com/z3z1ma/dbt-core-interface"
Documentation = "https://dbt-core-interface.readthedocs.io"
Changelog = "https://github.com/z3z1ma/dbt-core-interface/releases"

[project.optional-dependencies]
sqlfluff = [
  "sqlfluff>=4.4,<5"
]
server = [
  "fastapi>=0.162,<1",
  "uvicorn>=0.54,<1"
]
dev = [
  "dbt-duckdb",
  "ruff==0.17.3",
  "coverage[toml]>=7,<7.17; python_version < '3.11'",
  "coverage[toml]>=7.17,<8; python_version >= '3.11'",
  "pytest>=9.2,<10",
  "pytest-cov>=7.1,<8",
  "sqlfluff>=4.4,<5",
  "mypy>=1.0.0",
  "types-requests>=2.31.0",
]
 test = [
  "dbt-postgres>=1.8.0,<2.0.0",
  "dbt-core>=1.8.0,<2.0.0",
  "httpx>=0.24.0",
  "httpx2>=2.16,<3; python_version >= '3.11'",
  "psycopg2-binary>=2.8,<3.0",
  "sqlfluff>=4.4,<5"
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.coverage.paths]
source = ["src", "*/site-packages"]
tests = ["tests", "*/tests"]

[tool.coverage.run]
branch = true
source = ["dbt_core_interface", "tests"]

[tool.coverage.report]
show_missing = true
fail_under = 30

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "B9", "C", "D", "E", "F", "N", "S", "W"]
ignore = ["E501", "D203", "D213"]
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
  "dbt_core_interface.py",
]
per-file-ignores = { "tests/*" = ["S101"], "src/dbt_core_interface/project.py" = ["E402"], "src/dbt_core_interface/server.py" = ["B008"] }
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = false
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false
disable_error_code = ["import-untyped"]
exclude = [
    "tests/",
]

[[tool.mypy.overrides]]
module = "dbt.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sqlfluff.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fastapi.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "agate.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "uvicorn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "requests"
ignore_missing_imports = true

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "requests>=2.32.4",
]
server = [
    "fastapi>=0.162,<1",
    "httpx>=0.24.0",
    "uvicorn>=0.54,<1",
]

[project.entry-points."sqlfluff"]
dbt_templater = "dbt_core_interface.dbt_templater"
